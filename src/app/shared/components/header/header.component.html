<header>
    <nav class="navbar navbar-expand-lg bg-secondary-subtle px-3 py-2">
        <div class="container-fluid">
            <a class="navbar-brand" [routerLink]="''" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <img src="assets/images/Logo.png" alt="Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Переключатель навигации">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" [routerLink]="''" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" [routerLink]="'/products'" routerLinkActive="active">Каталог</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Поиск чая" aria-label="Поиск">
                    <button class="btn order border-primary text-primary bg-body px-3 py-1 hvr-bounce-to-right"
                        type="submit">Найти</button>
                </form>
            </div>
        </div>
    </nav>
</header>
