<section class="container p-0 mt-5 mb-5">
  <ngb-carousel class="custom-carousel" [interval]="2000" [pauseOnHover]="true" [wrap]="true">

    <ng-template ngbSlide>
      <img src="assets/images/slide1.png" class="w-100" alt="Image1">
    </ng-template>

    <ng-template ngbSlide>
      <img src="assets/images/slide2.png" class="w-100" alt="Image2">
    </ng-template>

    <ng-template ngbSlide>
      <img src="assets/images/slide3.png" class="w-100" alt="Image3">
    </ng-template>

  </ngb-carousel>


</section>

<section class="container align-items-center justify-content-center d-flex flex-column">
  <h2 class="text-center mt-2 mb-5">Ответы на часто задаваемые вопросы</h2>
  <ngb-accordion class="custom-accordion w-100">

    <ngb-panel title="Собираете ли вы подарочные боксы?">
      <ng-template ngbPanelContent>
        Да, у нас есть такая услуга.
      </ng-template>
    </ngb-panel>

    <ngb-panel title="Сколько у вас разновидностей чая?">
      <ng-template ngbPanelContent>
        В нашем ассортименте около 20 разновидностей чая.
      </ng-template>
    </ngb-panel>

    <ngb-panel title="В какой срок осуществляется доставка?">
      <ng-template ngbPanelContent>
        Доставка осуществляется в течение 5 рабочих дней.
      </ng-template>
    </ngb-panel>

    <ngb-panel title="В какой срок осуществляется доставка?">
      <ng-template ngbPanelContent>
        Наш ассортимент обновляется каждые 2 месяца.
      </ng-template>
    </ngb-panel>
  </ngb-accordion>
</section>

<div *ngIf="showPopup" class="popup-overlay">
  <div class="popup-content">
    <h3 class="mb-4">Посмотрите наши чайные коллекции</h3>
    <button class="btn btn-primary" routerLink="/products">Смотреть</button>
  </div>
</div>
