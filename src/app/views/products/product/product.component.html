<div class="container my-5">
    <div class="row g-4 align-items-start">
        <div class="col-12 col-md-6">
            <img [src]="product.image" alt="Card1" class="img-fluid rounded-4 shadow-sm">
        </div>
        <div class="col-12 col-md-6">
            <h2 class="fw-bold mb-3">{{ product.title }}</h2>
            <p class="lead mb-4">{{ product.description }}</p>
            <hr>
            <p class="fs-3">Цена: <strong class="text-primary">{{ product.price | number:'1.0-0' }} руб / 100
                    г.</strong></p>
            <a class="btn btn-primary btn-lg rounded-pill px-5 mt-3" routerLink="/order" [queryParams]="{product: product.title}">
                Купить
            </a>
        </div>
    </div>
</div>
